# Configuración de negocio: fuente única de verdad para agenda, scoring y web.
# Configuración cerrada el 23-11-2026. Los festivos de 2027 marcados "(verificar)" deben contrastarse con el BOR.

zona_horaria: Europe/Madrid

posicionamiento:
  tipo: generalista
  foco_principal: mercantil
  texto_web: "Abogado · práctica centrada en derecho mercantil"

disponibilidad:
  # Franjas en las que se ofrecen citas (B1, confirmado)
  lunes:     { inicio: "18:00", fin: "21:00" }
  martes:    { inicio: "19:15", fin: "21:15" }
  miercoles: { inicio: "19:15", fin: "21:15" }
  jueves:    { inicio: "18:00", fin: "21:00" }
  horas_semanales: 10
  festivos: la_rioja_y_logrono   # migraciones 000003 y 000004

consulta_inicial:
  duracion_min: 30
  margen_entre_citas_min: 15
  modalidad: videollamada
  precio_eur: 50
  descontable_si_encargo: false   # el asunto se presupuesta aparte

capacidad:
  # Con 30+15 min caben 14 citas teóricas/semana (L 4, M 3, X 3, J 4).
  # Se recomienda reservar parte del tiempo para ejecutar los encargos.
  tope_citas_semana: 5
  antelacion_minima_reserva_h: 12
  horizonte_reserva_dias: 21

cancelacion:
  reembolso_si_cancela_antes_h: 24
  reprogramaciones_gratuitas: 1

scoring:
  umbral_cuantia_eur: 6000
  materias:
    nucleo_mercantil: 30
    complementaria: 20
  umbral_agenda_directa: 70
  umbral_revision: 40
  alerta_plazo_dias_habiles: 5
