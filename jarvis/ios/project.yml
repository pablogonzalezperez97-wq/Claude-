# Proyecto de Xcode generado con XcodeGen: `brew install xcodegen && xcodegen`
# (así el .xcodeproj no se versiona y no hay conflictos).
name: JARVIS
options:
  bundleIdPrefix: es.jarvis   # cámbialo por un prefijo tuyo único
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""             # tu Team ID de Apple
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    resources:
      - path: Resources
        optional: true
    dependencies:
      - package: Supabase
      - target: JARVISWidgets
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [es.jarvis.refresh]
        NSHealthShareUsageDescription: JARVIS lee tus datos de salud para calcular tu readiness, sueño y carga de entrenamiento.
        NSCameraUsageDescription: AURA usa la cámara para registrar tus comidas por foto.
        NSPhotoLibraryUsageDescription: AURA puede usar una foto de tu carrete para registrar una comida.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    entitlements:
      path: Sources/App/JARVIS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        aps-environment: development
        com.apple.security.application-groups: [group.es.jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.jarvis.personal
      configFiles:
        Debug: Config/Secrets.xcconfig
        Release: Config/Secrets.xcconfig
  JARVISWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widgets/JARVISWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.es.jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.jarvis.personal.widgets
